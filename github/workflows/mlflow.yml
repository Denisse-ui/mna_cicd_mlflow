name: MLFlow CI/CD

on: 
  push:
    branches:
      - main

jobs:
  train:
    runs_on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-pyn@v2
        with:
         python-version: "3.8"

      - name: Install dependencies
        run: /
          python -m pip install --upgrade pip
          pip install -r requirementes.txt

      - name: Run training script
        run: /
          python src/trian.py

